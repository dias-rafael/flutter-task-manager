name: task_manager_app
description: 'A offline-first Flutter project using the BLoC pattern to manage state and handle business logic and Hive for local data storage.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  bloc_concurrency: 0.3.0
  equatable: 2.0.8
  dio: 5.4.0
  flutter_bloc: 9.1.1
  get_it: 7.2.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  stream_transform: 2.1.0
  uuid: 4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  build_runner: 2.4.13
  hive_generator: 2.0.1

flutter:
  uses-material-design: true
